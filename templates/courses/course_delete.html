{% extends "base.html" %}
{% load static %}

{% block title %}
Delete Course
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/course.css' %}">
{% endblock %}

{% block content %}
<section class="course-container">
    <h1 class="course-title">Delete Course</h1>
    <div class="course-card">
        <p>Are you sure you want delete <strong>{{ course.title }}</strong></p>
        <form action="" method="post">
            {% csrf_token %}
            <button type="submit" class="btn">Delete</button>
            <a href="{% url 'course_list' %}" class="edit-btn">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
