{% extends "base.html" %}
{% load static %}

{% block title %}
Create Note
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/course.css' %}">
{% endblock %}

{% block content %}
<section class="course-container">
    <h1 class="course-title">Create Note</h1>
    <form action="" method="post" class="course-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Create Note</button>
    </form>
</section>
{% endblock %}
