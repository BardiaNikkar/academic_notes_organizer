{% extends "base.html" %}
{% load static %}

{% block title %}
Delete Note 
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/course.css' %}">
{% endblock %}

{% block content %}
<section class="course-container">
    <h1 class="course-title">Delete Note</h1>
    <div class="course-card">
        <p>Are you sure to delete <strong>"{{ note.title }}"</strong>?</p>
        <form action="" method="post", class="course-form">
            {% csrf_token %}
            <button type="submit" class="delete-btn">Delete</button>
            <a href="{% url 'note_list' %}" class="edit-btn">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
